# Настройки, общие для всех стендов. Значения ${...} Spring берёт из переменных окружения контейнера
# (environment в docker-compose.yml в smart-factoring-deploy), после ':' - значение по умолчанию для локального запуска
server:
  # на стенде - GATEWAY_PORT из smart-factoring-deploy, compose передаёт его как SERVER_PORT
  port: ${SERVER_PORT}

spring:
  application:
    name: smart-factoring-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 60s

smart-factoring:
  gateway:
    backend-uri: ${BACKEND_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
