# Настройки, общие для всех стендов. Значения ${...} Spring берёт из переменных окружения контейнера
# (environment в docker-compose.yml в smart-factoring-deploy), после ':' - значение по умолчанию для локального запуска
server:
  # на стенде - GATEWAY_PORT из smart-factoring-deploy, compose передаёт его как SERVER_PORT
  port: ${SERVER_PORT}

spring:
  application:
    name: smart-factoring-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # iss токена: публичный адрес realm Keycloak, тот же, что видит браузер (например http://<vds>:8180/realms/smart-factoring-test)
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          # ключи подписи - напрямую из Keycloak по внутренней сети (http://keycloak:8080/realms/<realm>/protocol/openid-connect/certs);
          # при заданном jwk-set-uri issuer-uri только проверяется в токене, discovery по нему не запрашивается
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 60s

smart-factoring:
  gateway:
    backend-uri: ${BACKEND_URI}
    swagger:
      authorization-url: ${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/auth
      token-url: ${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/token

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Swagger UI: /swagger-ui.html, спецификация выбирается в выпадающем списке справа сверху
springdoc:
  # у gateway своих контроллеров нет, в его спецификации - эндпоинты actuator
  show-actuator: true
  swagger-ui:
    urls:
      # спецификация backend, переписанная под внешние пути gateway, см. RoutingConfiguration
      - name: backend
        url: /backend/v3/api-docs
      - name: gateway
        url: /v3/api-docs
    urls-primary-name: backend
    # токен из Authorize не теряется при перезагрузке страницы
    persist-authorization: true
    oauth:
      # публичный клиент realm Keycloak, вход через Authorization Code + PKCE
      client-id: ${KEYCLOAK_SWAGGER_CLIENT_ID:smart-factoring-swagger}
      use-pkce-with-authorization-code-grant: true
      scopes: openid
